name: Tag Trigger

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  triggered:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Build server
        # The Rust server backend was deprecated 2026-06.
        # The .NET Framework 4.8 server is the single
        # supported backend going forward. See
        # scripts/build-dotnet.ps1 for the .NET pipeline.
        # Note: this step now expects the .NET 8 SDK on
        # the runner (windows-latest has it preinstalled).
        run: yarn build:server

      - name: Create zip archive
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          # Ship the whole of dist/ (TS bundle + perfectwall-server/).
          # Compress-Archive -Path 'dist\*' recurses into
          # subdirectories automatically, so users get a
          # single zip containing the TS bundle at the root
          # and the server binary in the
          # perfectwall-server/ subfolder — same layout
          # that build-dotnet.ps1 lays out on disk.
          Compress-Archive -Path dist\* -DestinationPath "perfectwallpaper-${tag}.zip"

      - name: Extract release notes
        run: node scripts/generate-release-notes.cjs
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: Set release title output
        id: set-title
        run: |
          $title = Get-Content RELEASE_TITLE.txt -Raw
          echo "name=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.set-title.outputs.name }}
          body_path: RELEASE_NOTES.md
          draft: false
          files: |
            perfectwallpaper-*.zip
            # Post-2026-06 layout: server lives in its own
            # subfolder so dist/ root stays clean for the
            # TypeScript bundle. Uploading the EXE
            # individually (in addition to the zip) makes
            # it easy to grab a single artefact from the
            # release page without unzipping.
            dist/perfectwall-server/perfectwall-server.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}