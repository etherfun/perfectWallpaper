<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" type="text/css" href="./dist/default.css" />
    <title id="page-title">完美壁纸</title>
</head>

<body>
    <!-- #canvas-audio：由 NativeAudioVisualizer.ts 管理（有动态 fallback） -->
    <canvas id="canvas-audio"></canvas>

    <!-- #myAudio / #myvideo：由 video.ts / slide 等基础设施模块管理 -->
    <audio id="myAudio" autoplay loop></audio>
    <video id="myvideo" width="100%" height="100%" autoplay loop></video>

    <!-- #weather — 天气主容器（旧模块通过 elements.weather.weather 引用） -->

    <!-- 加载动画（Vue mount + 配置加载完成后自动移除） -->
    <div id="app-loading" class="app-loading">
        <div class="app-loading__spinner"></div>
        <div class="app-loading__text">完美壁纸</div>
    </div>

    <!-- Vue 应用挂载点 — 所有 Vue 组件在此渲染 -->
    <div id="app-root"></div>

    <script src="./dist/bundle.js"></script>
</body>

</html>
