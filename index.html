<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" type="text/css" href="./dist/style/default.css" />
    <title id="page-title">完美壁纸</title>
</head>

<body>
    <div id="background-container">
        <div id="background-blur-layer1" class="background-blur-layer"></div>
        <div id="background-blur-layer2" class="background-blur-layer"></div>
        <div id="background-layer1" class="background-layer" style="background-image: url('./src/source/imgs/1.jpg');"></div>
        <div id="background-layer2" class="background-layer"></div>
    </div>

    <audio id="myAudio" autoplay loop></audio>

    <video id="myvideo" width="100%" height="100%" autoplay loop></video>

    <div id="clock">
        <div class="block">
            <div class="min">17:00</div>
            <div class="time-indicators">
                <div class="st">AM</div>
                <div class="sec">00</div>
            </div>
        </div>
    </div>
    <div id="countdown">
        <div class="text">1</div>
    </div>

    <div id="oDate">
        <div class="text">2017</div>
    </div>

    <div id="weather">
        <div class="weather-container">
            <div class="weather-left">
                <div class="weather-icon" id="weatherIcon"></div>
                <div class="weather-temp" id="weatherTemp"></div>
                <div class="weather-text" id="weatherText"></div>
                <div class="weather-feels" id="weatherFeels"></div>
                <div class="weather-city" id="weatherCity"></div>
            </div>
            <div class="weather-right">
                <div class="weather-right-content">
                    <div class="weather-main-row">
                        <div class="weather-info-item temp-range" id="weatherTempRange">-- ~ --℃</div>
                        <div class="weather-info-item humidity" id="weatherHumidity" style="display:none;"></div>
                        <div class="weather-info-item wind-direction" id="weatherWindDirection"></div>
                        <div class="weather-info-item wind-level" id="weatherWindLevel" style="display:none;"></div>
                        <div class="weather-info-item wind-speed" id="weatherWindSpeed" style="display:none;"></div>
                        <div class="weather-info-item visibility" id="weatherVisibility" style="display:none;"></div>
                    </div>
                    <div class="weather-detail-row" id="weatherDetailRow" style="display:none;">
                        <div class="weather-detail-item uv-index" id="weatherUvIndex"></div>
                        <div class="weather-info-item cloud" id="weatherCloud" style="display:none;"></div>
                        <div class="weather-detail-item sunrise" id="weatherSunrise"></div>
                        <div class="weather-detail-item sunset" id="weatherSunset"></div>
                        <div class="weather-detail-item moonphase" id="weatherMoonphase" style="display:none;"></div>
                    </div>
                    <div class="weather-air-row" id="weatherAirRow" style="display:none;">
                        <div class="weather-air-item air-quality" id="weatherAirQuality"></div>
                        <div class="weather-air-item air-value" id="weatherAirValue"></div>
                        <div class="weather-alert-container" id="weatherAlertContainer" style="display:none;"></div>
                    </div>
                    <div class="weather-precip-container" id="weatherPrecipContainer" style="display:none;">
                        <div class="precip-label" id="weatherPrecipLabel" data-display-type="precipitation" data-i18n="weather_show_precipprob"></div>
                        <div class="precip-content">
                            <div class="precip-times" id="weatherPrecipTimes">
                                <span class="precip-time-cell" id="weatherPrecipTime0">--:--</span>
                                <span class="precip-time-cell" id="weatherPrecipTime1">--:--</span>
                                <span class="precip-time-cell" id="weatherPrecipTime2">--:--</span>
                                <span class="precip-time-cell" id="weatherPrecipTime3">--:--</span>
                                <span class="precip-time-cell" id="weatherPrecipTime4">--:--</span>
                                <span class="precip-time-cell" id="weatherPrecipTime5">--:--</span>
                                <span class="precip-time-cell" id="weatherPrecipTime6">--:--</span>
                            </div>
                            <div class="precip-values" id="weatherPrecipValues">
                                <span class="precip-prob-cell" id="weatherPrecipValue0" data-hour-index="0">--</span>
                                <span class="precip-prob-cell" id="weatherPrecipValue1" data-hour-index="1">--</span>
                                <span class="precip-prob-cell" id="weatherPrecipValue2" data-hour-index="2">--</span>
                                <span class="precip-prob-cell" id="weatherPrecipValue3" data-hour-index="3">--</span>
                                <span class="precip-prob-cell" id="weatherPrecipValue4" data-hour-index="4">--</span>
                                <span class="precip-prob-cell" id="weatherPrecipValue5" data-hour-index="5">--</span>
                                <span class="precip-prob-cell" id="weatherPrecipValue6" data-hour-index="6">--</span>
                            </div>
                        </div>
                    </div>
                    <div class="weather-row weather-tip" id="weatherTip" style="display:none;"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="weatherAlertTooltip" class="weather-tooltip">
        <div class="tooltip-cards-container">
        </div>
    </div>
    <div id="weatherHourlyTooltip" role="document">
        <div class="popup-main">
            <div>
                <div class="big-icon" id="pIcon">
                    <div id="pIconImg" class="icon-box"></div>
                    <div>
                        <div class="big-temp" id="pTemp">--°</div>
                        <div class="popup-sub" id="pText" data-i18n="weather_tooltip_default_weather">多云</div>
                    </div>
                </div>
            </div>

            <div>
                <div class="details-grid">
                    <div class="detail-item">
                        <div class="detail-label" data-i18n="weather_tooltip_relative_humidity">相对湿度</div>
                        <div class="detail-value" id="pHumidity">--%</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label" data-i18n="weather_tooltip_precipitation_rate">降水率 / 降水量</div>
                        <div class="detail-value" id="pPrecip">-- mm</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label" data-i18n="weather_tooltip_pressure">气压</div>
                        <div class="detail-value" id="pPressure">-- hPa</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label" data-i18n="weather_tooltip_cloud_cover">云量</div>
                        <div class="detail-value" id="pClouds">--%</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label" data-i18n="weather_tooltip_dew_point">露点</div>
                        <div class="detail-value" id="pDew">--°C</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label" data-i18n="weather_tooltip_wind_direction">风向 / 角度</div>
                        <div class="detail-value" id="pWindDir">— / —°</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label" data-i18n="weather_tooltip_wind_level">风力等级</div>
                        <div class="detail-value" id="pWindLv">—</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label" data-i18n="weather_tooltip_wind_speed">风速</div>
                        <div class="detail-value" id="pWindSpeed">— m/s</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <template id="weatherAlerttooltipCardTemplate">
        <div class="tooltip-card">
            <!-- 头部信息 -->
            <div class="tooltip-header">
                <div class="left">
                    <div class="tooltip-title"></div>
                    <div class="sender"></div>
                    <div class="tooltip-time"><span class="text"></span> <span class="state"></span></div>

                    <!-- 事件信息 -->
                    <div class="tooltip-event">
                        <div class="event-severity"><span class="text"></span></div>
                        <div class="event-timing">
                            <span class="start" data-i18n="weather_alert_start_time"><span class="time"></span></span>
                            <br>
                            <span class="end" data-i18n="weather_alert_expect_end_time">
                                <span class="time"></span>
                            </span>
                        </div>
                    </div>
                </div>
                <!--图标-->
                <div class="tooltip-icon"></div>
            </div>

            <!-- 预警信息 -->
            <div class="tooltip-headline"></div>
            <div class="tooltip-description"></div>

            <!-- 预警标准 -->
            <div class="tooltip-criteria"></div>

            <!-- 防范措施 -->
            <div class="tooltip-instructions">
                <strong data-i18n="weather_alert_action"></strong>
                <ol></ol>
            </div>

            <!-- 数据来源 -->
            <div class="tooltip-source"></div>
        </div>
    </template>

    <!-- sakura shader -->
    <script id="sakura_point_vsh" type="x-shader/x_vertex">
    //樱花
    uniform mat4 uProjection;
    uniform mat4 uModelview;
    uniform vec3 uResolution;
    uniform vec3 uOffset;
    uniform vec3 uDOF;  //x:focus distance, y:focus radius, z:max radius
    uniform vec3 uFade; //x:start distance, y:half distance, z:near fade start

    attribute vec3 aPosition;
    attribute vec3 aEuler;
    attribute vec2 aMisc; //x:size, y:fade

    varying vec3 pposition;
    varying float psize;
    varying float palpha;
    varying float pdist;

    //varying mat3 rotMat;
    varying vec3 normX;
    varying vec3 normY;
    varying vec3 normZ;
    varying vec3 normal;

    varying float diffuse;
    varying float specular;
    varying float rstop;
    varying float distancefade;

    void main(void) {
        // Projection is based on vertical angle
        vec4 pos = uModelview * vec4(aPosition + uOffset, 1.0);
        gl_Position = uProjection * pos;
        gl_PointSize = aMisc.x * uProjection[1][1] / -pos.z * uResolution.y * 0.5;

        pposition = pos.xyz;
        psize = aMisc.x;
        pdist = length(pos.xyz);
        palpha = smoothstep(0.0, 1.0, (pdist - 0.1) / uFade.z);

        vec3 elrsn = sin(aEuler);
        vec3 elrcs = cos(aEuler);
        mat3 rotx = mat3(
            1.0, 0.0, 0.0,
            0.0, elrcs.x, elrsn.x,
            0.0, -elrsn.x, elrcs.x
        );
        mat3 roty = mat3(
            elrcs.y, 0.0, -elrsn.y,
            0.0, 1.0, 0.0,
            elrsn.y, 0.0, elrcs.y
        );
        mat3 rotz = mat3(
            elrcs.z, elrsn.z, 0.0,
            -elrsn.z, elrcs.z, 0.0,
            0.0, 0.0, 1.0
        );
        mat3 rotmat = rotx * roty * rotz;
        normal = rotmat[2];

        mat3 trrotm = mat3(
            rotmat[0][0], rotmat[1][0], rotmat[2][0],
            rotmat[0][1], rotmat[1][1], rotmat[2][1],
            rotmat[0][2], rotmat[1][2], rotmat[2][2]
        );
        normX = trrotm[0];
        normY = trrotm[1];
        normZ = trrotm[2];

        const vec3 lit = vec3(0.6917144638660746, 0.6917144638660746, -0.20751433915982237);

        float tmpdfs = dot(lit, normal);
        if(tmpdfs < 0.0) {
            normal = -normal;
            tmpdfs = dot(lit, normal);
        }
        diffuse = 0.4 + tmpdfs;

        vec3 eyev = normalize(-pos.xyz);
        if(dot(eyev, normal) > 0.0) {
            vec3 hv = normalize(eyev + lit);
            specular = pow(max(dot(hv, normal), 0.0), 20.0);
        }
        else {
            specular = 0.0;
        }

        rstop = clamp((abs(pdist - uDOF.x) - uDOF.y) / uDOF.z, 0.0, 1.0);
        rstop = pow(rstop, 0.5);
        //-0.69315 = ln(0.5)
        distancefade = min(1.0, exp((uFade.x - pdist) * 0.69315 / uFade.y));
    }
    </script>
    <script id="sakura_point_fsh" type="x-shader/x_fragment">
    #ifdef GL_ES
    //precision mediump float;
    precision highp float;
    #endif

    uniform vec3 uDOF;  //x:focus distance, y:focus radius, z:max radius
    uniform vec3 uFade; //x:start distance, y:half distance, z:near fade start

    const vec3 fadeCol = vec3(0.08, 0.03, 0.06);

    varying vec3 pposition;
    varying float psize;
    varying float palpha;
    varying float pdist;

    //varying mat3 rotMat;
    varying vec3 normX;
    varying vec3 normY;
    varying vec3 normZ;
    varying vec3 normal;

    varying float diffuse;
    varying float specular;
    varying float rstop;
    varying float distancefade;

    float ellipse(vec2 p, vec2 o, vec2 r) {
        vec2 lp = (p - o) / r;
        return length(lp) - 1.0;
    }

    void main(void) {
        vec3 p = vec3(gl_PointCoord - vec2(0.5, 0.5), 0.0) * 2.0;
        vec3 d = vec3(0.0, 0.0, -1.0);
        float nd = normZ.z; //dot(-normZ, d);
        if(abs(nd) < 0.0001) discard;

        float np = dot(normZ, p);
        vec3 tp = p + d * np / nd;
        vec2 coord = vec2(dot(normX, tp), dot(normY, tp));

        //angle = 15 degree
        const float flwrsn = 0.28819045102521;
        const float flwrcs = 0.965925826289068;
        mat2 flwrm = mat2(flwrcs, -flwrsn, flwrsn, flwrcs);
        vec2 flwrp = vec2(abs(coord.x), coord.y) * flwrm;

        float r;
        if(flwrp.x < 0.0) {
            r = ellipse(flwrp, vec2(0.065, 0.024) * 0.5, vec2(0.36, 0.96) * 0.5);
        }
        else {
            r = ellipse(flwrp, vec2(0.065, 0.024) * 0.5, vec2(0.58, 0.96) * 0.5);
        }

        if(r > rstop) discard;
        //花瓣颜色
        vec3 col = mix(vec3(1.0, 0.9, 0.75), vec3(1.0, 0.9, 0.87), r);
        float grady = mix(0.0, 1.0, pow(coord.y * 0.5 + 0.5, 0.35));
        col *= vec3(3.0, grady, grady);
        col *= mix(0.9, 1.0, pow(abs(coord.x), 1.0));
        col = col * diffuse + specular;

        col = mix(fadeCol, col, distancefade);

        float alpha = (rstop > 0.001)? (0.5 - r / (rstop * 2.0)) : 1.0;
        alpha = smoothstep(0.0, 1.0, alpha) * palpha;

        gl_FragColor = vec4(col * 3.0, alpha);
    }
    </script>
    <!-- effects -->
    <script id="fx_common_vsh" type="x-shader/x_vertex">
    uniform vec3 uResolution;
    attribute vec2 aPosition;

    varying vec2 texCoord;
    varying vec2 screenCoord;

    void main(void) {
        gl_Position = vec4(aPosition, 0.0, 1.0);
        texCoord = aPosition.xy * 0.5 + vec2(0.5, 0.5);
        screenCoord = aPosition.xy * vec2(uResolution.z, 1.0);
    }
    </script>
    <script id="bg_fsh" type="x-shader/x_fragment">
    #ifdef GL_ES
    //precision mediump float;
    precision highp float;
    #endif

    uniform vec2 uTimes;

    varying vec2 texCoord;
    varying vec2 screenCoord;

    void main(void) {
        vec3 col;
        float c;
        vec2 tmpv = texCoord * vec2(0.8, 1.0) - vec2(0.95, 1.0);
        c = exp(-pow(length(tmpv) * 1.2, 2.0));
        col = mix(vec3(0.05, 0.0, 0.03), vec3(0.96,0.88, 1.0) * 1.5, c);
        gl_FragColor = vec4(col * 0.5, 1.0);
    }
    </script>
    <script id="fx_brightbuf_fsh" type="x-shader/x_fragment">
    #ifdef GL_ES
    //precision mediump float;
    precision highp float;
    #endif
    uniform sampler2D uSrc;
    uniform vec2 uDelta;

    varying vec2 texCoord;
    varying vec2 screenCoord;

    void main(void) {
        vec4 col = texture2D(uSrc, texCoord);
        gl_FragColor = vec4(col.rgb * 2.0 - vec3(0.5), 1.0);
    }
    </script>
    <script id="fx_dirblur_r4_fsh" type="x-shader/x_fragment">
    #ifdef GL_ES
    //precision mediump float;
    precision highp float;
    #endif
    uniform sampler2D uSrc;
    uniform vec2 uDelta;
    uniform vec4 uBlurDir; //dir(x, y), stride(z, w)

    varying vec2 texCoord;
    varying vec2 screenCoord;

    void main(void) {
        vec4 col = texture2D(uSrc, texCoord);
        col = col + texture2D(uSrc, texCoord + uBlurDir.xy * uDelta);
        col = col + texture2D(uSrc, texCoord - uBlurDir.xy * uDelta);
        col = col + texture2D(uSrc, texCoord + (uBlurDir.xy + uBlurDir.zw) * uDelta);
        col = col + texture2D(uSrc, texCoord - (uBlurDir.xy + uBlurDir.zw) * uDelta);
        gl_FragColor = col / 7.5;
    }
    </script>
    <!-- effect fragment shader template -->
    <script id="fx_common_fsh" type="x-shader/x_fragment">
    #ifdef GL_ES
    //precision mediump float;
    precision highp float;
    #endif
    uniform sampler2D uSrc;
    uniform vec2 uDelta;

    varying vec2 texCoord;
    varying vec2 screenCoord;

    void main(void) {
        gl_FragColor = texture2D(uSrc, texCoord);
    }
    </script>
    <!-- post processing -->
    <script id="pp_final_vsh" type="x-shader/x_vertex">
    uniform vec3 uResolution;
    attribute vec2 aPosition;
    varying vec2 texCoord;
    varying vec2 screenCoord;
    void main(void) {
        gl_Position = vec4(aPosition, 0.0, 1.0);
        texCoord = aPosition.xy * 0.5 + vec2(0.5, 0.5);
        screenCoord = aPosition.xy * vec2(uResolution.z, 1.0);
    }
    </script>
    <script id="pp_final_fsh" type="x-shader/x_fragment">
    #ifdef GL_ES
    //precision mediump float;
    precision highp float;
    #endif
    uniform sampler2D uSrc;
    uniform sampler2D uBloom;
    uniform vec2 uDelta;
    varying vec2 texCoord;
    varying vec2 screenCoord;
    void main(void) {
        vec4 srccol = texture2D(uSrc, texCoord) * 2.0;
        vec4 bloomcol = texture2D(uBloom, texCoord);
        vec4 col;
        col = srccol + bloomcol * (vec4(1.0) + srccol);
        col *= smoothstep(1.0, 0.0, pow(length((texCoord - vec2(0.5)) * 2.0), 1.2) * 0.5);
        col = pow(col, vec4(0.45454545454545)); //(1.0 / 2.2)

        gl_FragColor = vec4(col.rgb, 0.01);
        gl_FragColor.a = 0.01;
    }
    </script>
