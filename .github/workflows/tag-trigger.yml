name: Tag Trigger

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  triggered:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.3

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Build server
        run: yarn build:server:rust
        env:
          RUSTC_WRAPPER: sccache

      - name: Create zip archive
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          Compress-Archive -Path dist\* -DestinationPath "perfectwallpaper-${tag}.zip"

      - name: Extract release notes
        run: node scripts/generate-release-notes.cjs

      - name: Set release title output
        id: set-title
        run: |
          $title = Get-Content RELEASE_TITLE.txt -Raw
          echo "name=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.set-title.outputs.name }}
          body_path: RELEASE_NOTES.md
          draft: false
          files: |
            perfectwallpaper-*.zip
            dist/perfectwall-server.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}