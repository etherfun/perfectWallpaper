name: Tag Trigger

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  triggered:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      # nuget.config pins globalPackagesFolder to the
      # repo-relative src/server-dotnet/packages/, so
      # caching that directory makes `dotnet restore`
      # (inside build:server) skip re-downloading
      # LibreHardwareMonitorLib / Newtonsoft.Json /
      # TagLibSharp / Costura.Fody on every tag build.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: src/server-dotnet/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/server-dotnet/perfectwall-server.csproj', 'src/server-dotnet/nuget.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Build server
        # The Rust server backend was deprecated 2026-06.
        # The .NET Framework 4.8 server is the single
        # supported backend going forward. See
        # scripts/build-dotnet.ps1 for the .NET pipeline.
        # Note: this step now expects the .NET 8 SDK on
        # the runner (windows-latest has it preinstalled).
        run: yarn build:server

      - name: Create zip archive
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          # Ship the whole of dist/ (TS bundle + perfectwall-server/).
          # Compress-Archive -Path 'dist\*' recurses into
          # subdirectories automatically, so users get a
          # single zip containing the TS bundle at the root
          # and the server binary in the
          # perfectwall-server/ subfolder — same layout
          # that build-dotnet.ps1 lays out on disk.
          Compress-Archive -Path dist\* -DestinationPath "perfectwallpaper-${tag}.zip"

      - name: Extract release notes
        run: node scripts/generate-release-notes.cjs
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: Set release title output
        id: set-title
        run: |
          $title = Get-Content RELEASE_TITLE.txt -Raw
          echo "name=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.set-title.outputs.name }}
          body_path: RELEASE_NOTES.md
          draft: false
          files: |
            perfectwallpaper-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}