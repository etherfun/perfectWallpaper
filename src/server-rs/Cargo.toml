[package]
name = "perfectwall-server"
version = "1.0.0"
edition = "2021"
description = "System info server for Wallpaper Engine"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# System info
sysinfo = "0.30"

# Audio metadata
lofty = "0.18"

# Time
chrono = "0.4"

# Async utilities
futures-util = "0.3"
bytes = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Windows GPU info and console
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Graphics_Dxgi",
    "Win32_System_Console"
]}

hardware-query = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
